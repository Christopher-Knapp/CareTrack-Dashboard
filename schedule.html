<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareTrack Schedule</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="dashboard">
      <!-- Sidebar -->
      <aside class="sidebar">
        <h2>CareTrack</h2>

        <nav>
          <a href="index.html">Dashboard</a>
          <a href="patients.html">Patients</a>
          <a href="schedule.html" class="active">Schedule</a>
          <a href="reports.html">Reports</a>
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="main">
        <header>
          <h1>Schedule</h1>
          <p>Manage patient appointments</p>
        </header>

        <section class="patients">
          <div class="patient-header">
            <h2>Appointments</h2>

            <div class="patient-controls">
              <button id="addAppointmentBtn">+ Add Appointment</button>
            </div>
          </div>

          <table>
            <thead>
              <tr>
                <th>Patient</th>
                <th>Date</th>
                <th>Time</th>
                <th>Counselor</th>
                <th>Type</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody id="appointmentTable"></tbody>
          </table>
        </section>
      </main>
    </div>

    <!-- Appointment Modal -->

    <div class="modal" id="appointmentModal">
      <div class="modal-content">
        <span class="close" id="closeAppointmentModal"> &times; </span>

        <h2>Add Appointment</h2>

        <form id="appointmentForm">
          <input
            type="text"
            id="appointmentPatient"
            placeholder="Patient Name"
            required
          />

          <input type="date" id="appointmentDate" required />

          <input type="time" id="appointmentTime" required />

          <input
            type="text"
            id="appointmentCounselor"
            placeholder="Counselor"
            required
          />

          <select id="appointmentType">
            <option value="Follow Up">Follow Up</option>

            <option value="Therapy">Therapy Session</option>

            <option value="Assessment">Assessment</option>
          </select>

          <select id="appointmentStatus">
            <option value="Scheduled">Scheduled</option>

            <option value="Completed">Completed</option>

            <option value="Cancelled">Cancelled</option>
          </select>

          <button type="submit">Save Appointment</button>
        </form>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
