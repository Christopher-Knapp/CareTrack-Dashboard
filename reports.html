<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareTrack Reports</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="dashboard">
      <!-- Sidebar -->
      <aside class="sidebar">
        <h2>CareTrack</h2>

        <nav>
          <a href="index.html">Dashboard</a>
          <a href="patients.html">Patients</a>
          <a href="schedule.html">Schedule</a>
          <a href="reports.html" class="active">Reports</a>
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="main">
        <header>
          <h1>Reports</h1>
          <p>Patient and appointment overview</p>
        </header>

        <section class="cards">
          <div class="card">
            <h3>Total Patients</h3>
            <p id="reportTotalPatients">0</p>
          </div>

          <div class="card">
            <h3>Active Patients</h3>
            <p id="reportActivePatients">0</p>
          </div>

          <div class="card">
            <h3>Follow Ups</h3>
            <p id="reportFollowUps">0</p>
          </div>

          <div class="card">
            <h3>Discharged</h3>
            <p id="reportDischarged">0</p>
          </div>

          <div class="card">
            <h3>Appointments</h3>
            <p id="reportAppointments">0</p>
          </div>
        </section>

        <section class="patients">
          <h2>Patient Status Summary</h2>

          <table class="report-table">
            <thead>
              <tr>
                <th>Status</th>
                <th>Count</th>
              </tr>
            </thead>

            <tbody>
              <tr>
                <td>Active</td>
                <td id="activeCount">0</td>
              </tr>

              <tr>
                <td>Follow Up</td>
                <td id="followUpCount">0</td>
              </tr>

              <tr>
                <td>Discharged</td>
                <td id="dischargedCount">0</td>
              </tr>
            </tbody>
          </table>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
